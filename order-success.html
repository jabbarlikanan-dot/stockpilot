<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#080b07" />
    <link rel="icon" type="image/png" href="stockpilot-192.png" />
    <title>Sifariş qəbul edildi — StockPilot</title>
    <link rel="stylesheet" href="store.css" />
    <link rel="stylesheet" href="store-success.css" />
  </head>
  <body>
    <main class="success-wrap">
      <section class="success-card success-card-wide">
        <div class="success-mark">✓</div>
        <img src="stockpilot-logo.png" alt="StockPilot" class="success-logo" />
        <h1>Sifarişiniz qəbul edildi</h1>
        <p>Sifarişinizin vəziyyətini istənilən vaxt QR kodla izləyə bilərsiniz.</p>

        <div class="tracking-grid">
          <div class="qr-card">
            <span class="qr-label">SİFARİŞİ İZLƏ</span>
            <img id="trackingQr" class="tracking-qr" alt="Sifariş izləmə QR kodu" />
            <small>Telefonun kamerası ilə QR kodu oxudun.</small>
          </div>
          <div class="tracking-info">
            <span class="tracking-kicker">Sifariş kodu</span>
            <strong id="orderRef">—</strong>
            <p>QR işləməsə, aşağıdakı düymə ilə izləmə səhifəsini aça bilərsiniz.</p>
            <a id="trackOrder" class="track-order-btn" href="#">Sifarişi izlə</a>
          </div>
        </div>

        <a id="returnStore" class="return-store" href="store.html">Mağazaya qayıt</a>
      </section>
    </main>
    <script src="order-success.js"></script>
  </body>
</html>
