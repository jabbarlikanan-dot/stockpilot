<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#080b07" />
    <link rel="icon" type="image/png" href="stockpilot-192.png" />
    <title>Mağaza — StockPilot</title>
    <link rel="stylesheet" href="store.css" />
  </head>
  <body>
    <header class="store-header"><a href="index.html" aria-label="StockPilot ana səhifə"><img src="stockpilot-logo.png" alt="StockPilot" class="store-logo" /></a><button id="cartButton">Səbət <b id="cartCount">0</b></button></header>
    <main><section class="hero"><p id="shopTag">ONLAYN MAĞAZA</p><h1 id="shopName">Mağaza yüklənir…</h1><p>Məhsulları seçin, rahat şəkildə sifariş edin.</p></section><div id="categories" class="categories"></div><section id="products" class="products"></section></main>
    <aside id="cart" class="cart hidden" aria-label="Səbət"><header><b>Səbətiniz</b><button id="closeCart" aria-label="Səbəti bağla">×</button></header><div id="cartLines"></div><form id="checkout"><h2>Sifarişi tamamla</h2><input name="name" placeholder="Ad və soyad" required><input name="phone" inputmode="tel" placeholder="Telefon nömrəsi" required><textarea name="note" placeholder="Əlavə qeyd (istəyə bağlı)"></textarea><div class="schedule"><label>Çatdırılma tarixi<input id="preferredDate" name="preferredDate" type="date" required></label><label>Çatdırılma saatı (24 saat)<input id="preferredTime" name="preferredTime" type="text" inputmode="numeric" placeholder="14:30" pattern="(?:[01][0-9]|2[0-3]):[0-5][0-9]" required></label></div><select name="delivery"><option value="metro">Metroda təhvil</option><option value="address">Ünvana çatdırılma</option></select><input name="metro" placeholder="Metro / rayon"><input name="address" placeholder="Tam ünvan"><select name="payment"><option value="cash">Nağd ödəniş</option><option value="card">Kartla ödəniş (çatdırılmada)</option></select><button class="buy" type="submit">Sifarişi göndər</button><p id="message" role="alert"></p></form></aside><div id="toast" class="store-toast" role="status" aria-live="polite"></div><script src="store.js"></script>
  </body>
</html>
