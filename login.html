<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#080b07" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="stockpilot-192.png"
    />
    <link rel="apple-touch-icon" href="stockpilot-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Giriş — StockPilot</title>
    <link rel="stylesheet" href="app.css" />
      <link rel="stylesheet" href="redesign.css" />
</head>
  <body>
    <section class="auth-shell">
      <div class="hero">
        <div class="brand brand-image"><img src="stockpilot-logo.png" alt="StockPilot" /></div>
        <h1>Hesabına <em>daxil ol.</em></h1>
        <p>Şəxsi sifariş sahən hər yerdə səninlədir.</p>
      </div>
      <aside class="auth-side">
        <div class="auth-card">
          <form id="loginForm" class="form active">
            <h2>Giriş</h2>
            <p>Username və 4 rəqəmli şifrə.</p>
            <div class="field">
              <label>Username</label><input name="username" required />
            </div>
            <div class="field">
              <label>Şifrə</label
              ><input
                name="password"
                type="password"
                inputmode="numeric"
                maxlength="4"
                required
              />
            </div>
            <small class="msg"></small><button class="primary">Daxil ol</button>
            <p style="margin-top: 15px">
              <a href="index.html">Ana səhifəyə qayıt</a>
            </p>
          </form>
        </div>
      </aside>
    </section>
    <script src="auth.js"></script>
  </body>
</html>
