<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#080b07" />
    <link rel="icon" type="image/png" href="stockpilot-192.png" />
    <link rel="apple-touch-icon" href="stockpilot-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Müştəri sifarişləri — StockPilot</title>
    <link rel="stylesheet" href="orders.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="logo"><i class="brand-mark">↑</i>StockPilot</div>
        <span class="nav-title">İdarəetmə</span>
        <nav>
          <a id="personalOrdersPanel" class="nav-link" href="dashboard.html"><span class="nav-icon icon-orders"></span>Şəxsi sifarişlər</a>
          <button id="customerOrdersPanel" class="active"><span class="nav-icon icon-orders"></span>Müştəri sifarişləri</button>
          <button id="openStats"><span class="nav-icon icon-stats"></span>Ümumi statistika</button>
          <a class="nav-link" href="inventory.html"><span class="nav-icon icon-orders"></span>Stok nəzarəti</a>
          <button id="openSettings"><span class="nav-icon icon-settings"></span>Ayarlar</button>
          <button id="logout"><span class="nav-icon icon-exit"></span>Çıxış</button>
        </nav>
        <small class="side-note">v2.1 • Şəxsi hesab</small>
      </aside>
      <main>
        <header class="topbar">
          <span><b>İdarəetmə paneli</b> / Müştəri sifarişləri</span>
          <div><button id="storeBtn" class="secondary">Mağazam</button><button id="profileBtn" class="profile" title="Profil ayarları"><b id="profileInitial">U</b><span id="profileName">Hesabım</span></button></div>
        </header>
        <section class="heading"><div><h1>Müştəri sifarişləri</h1><p>Mağazadan gələn sifarişləri, statusu və müştəri məlumatlarını idarə edin.</p></div></section>
        <div id="tabs" class="tabs hidden"></div>
        <section id="content"></section>
      </main>
    </div>
    <nav class="mobile-bottom" aria-label="Sürətli menyu"><a href="dashboard.html"><i>▦</i>Şəxsi</a><a class="active" href="customer-orders.html"><i>◉</i>Müştəri</a><a href="inventory.html"><i>▤</i>Stok</a><a href="account.html"><i>◔</i>Hesab</a></nav>
    <div id="modal" class="overlay hidden"><section class="modal"><header><h2 id="modalTitle"></h2><button id="closeModal" class="x">×</button></header><div id="modalBody"></div></section></div>
    <div id="undoToast" class="undo-toast hidden"></div>
    <script src="orders-bootstrap.js"></script>
  </body>
</html>
