<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#080b07" />
    <link rel="icon" type="image/png" href="stockpilot-192.png" />
    <link rel="apple-touch-icon" href="stockpilot-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Sifarişlər — StockPilot</title>
    <link rel="stylesheet" href="orders.css" />
    <link rel="stylesheet" href="shell.css" />
      <link rel="stylesheet" href="redesign.css" />
    <link rel="stylesheet" href="v28.css" />
    <link rel="stylesheet" href="v29.css" />
    <link rel="stylesheet" href="v30.css" />
    <link rel="stylesheet" href="v33.css" />
</head>
  <body>
    <div class="app-shell">
      <aside class="app-sidebar" aria-label="Əsas menyu">
        <div class="sidebar-head"><a class="sidebar-brand" href="dashboard.html" aria-label="StockPilot ana səhifə"><img class="brand-logo-full" src="stockpilot-logo.png" alt="StockPilot" /><img class="brand-logo-mark" src="stockpilot-192.png" alt="" /></a><button class="sidebar-toggle" data-sidebar-toggle aria-label="Menyunu yığ"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
        <p class="nav-caption">İdarəetmə</p>
        <nav class="app-nav">
          <button id="personalOrdersPanel" class="active" title="Şəxsi sifarişlər"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 7h6M9 11h6M9 15h3"/></svg><span class="nav-label">Şəxsi sifarişlər</span></button>
          <a id="customerOrdersPanel" href="customer-orders.html" title="Müştəri sifarişləri"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4zM8 10h.01M12 10h4M8 14h8"/></svg><span class="nav-label">Müştəri sifarişləri</span></a>
          <button id="openStats" title="Ümumi statistika"><svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M8 16v-5m4 5V7m4 9v-3"/></svg><span class="nav-label">Ümumi statistika</span></button>
          <a href="inventory.html" title="Stok nəzarəti"><svg viewBox="0 0 24 24"><path d="m4 8 8-4 8 4-8 4-8-4Zm0 0v8l8 4 8-4V8"/></svg><span class="nav-label">Stok nəzarəti</span></a>
          <button id="openSettings" title="Tarif və ayarlar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06A1.7 1.7 0 0 0 15.74 18a1.7 1.7 0 0 0-1.02 1.56V20h-3v-.44A1.7 1.7 0 0 0 10.7 18a1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7 14.34 1.7 1.7 0 0 0 5.44 13.3H5v-3h.44A1.7 1.7 0 0 0 7 9.28a1.7 1.7 0 0 0-.34-1.88L6.6 7.34l2.12-2.12.06.06A1.7 1.7 0 0 0 10.66 5 1.7 1.7 0 0 0 11.7 3.44V3h3v.44A1.7 1.7 0 0 0 15.72 5a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.12 2.12-.06.06A1.7 1.7 0 0 0 19.4 8.66 1.7 1.7 0 0 0 21 9.7h.44v3H21A1.7 1.7 0 0 0 19.4 15Z"/></svg><span class="nav-label">Tarif və ayarlar</span></button>
          <a href="profile.html" title="Profil ayarları"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-4 3.1-6 7-6s6.2 2 7 6"/></svg><span class="nav-label">Profil ayarları</span></a>
          <button id="logout" title="Çıxış"><svg viewBox="0 0 24 24"><path d="M10 4H5v16h5M14 8l4 4-4 4m4-4H9"/></svg><span class="nav-label">Çıxış</span></button>
        </nav>
        <small class="sidebar-foot">v2.2 · Şəxsi hesab</small>
      </aside>
      <main class="app-main">
        <header class="topbar">
          <span><b>İdarəetmə paneli</b> / Sifarişlər</span>
          <div class="topbar-actions">
            <button id="storeBtn" class="secondary topbar-key-action">Mağazam</button>
            <details class="topbar-more">
              <summary class="secondary">Daha çox</summary>
              <div class="topbar-more-menu">
                <button id="importBtn" class="secondary">Excel-dən əlavə et</button>
                <button id="templateBtn" class="secondary">Nümunə Excel</button>
                <button id="exportBtn" class="secondary">Excel ixracı</button>
                <button id="quoteBtn" class="secondary">Qiymət təklifi</button>
              </div>
            </details>
            <div class="notification-menu"><button id="notificationButton" class="notification-button" aria-label="Bildirişlər" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><b id="notificationBadge" class="notification-badge hidden">0</b></button><section id="notificationPopover" class="notification-popover hidden"><div class="notification-popover-head"><b>Bildirişlər</b><button id="readAllNotifications">Oxundu et</button></div><div id="notificationPreview" class="notification-preview"></div><a id="allNotifications" class="notification-all" href="#">Hamısına bax →</a></section></div
            ><button id="profileBtn" class="profile" title="Profil ayarları">
              <b id="profileInitial">U</b><span id="profileName">Hesabım</span>
            </button>
          </div>
        </header>
        <section class="heading">
          <div>
            <h1>Şəxsi sifarişlər</h1>
            <p>
              Alış, satış, qazanc və stoku bir paneldə izləyin.
            </p>
          </div>
          <div class="heading-actions"><button id="archiveToggle" class="secondary">Arxiv</button><button id="newOrderTop" class="primary">+ Yeni sifariş</button></div>
        </section>
        <section id="operationsHub" class="operations-hub" aria-live="polite"></section>
        <div id="tabs" class="tabs"></div>
        <section id="content"></section>
      </main>
    </div>
    <nav class="mobile-bottom" aria-label="Sürətli menyu">
      <a class="active" href="dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>Sifarişlər</span></a>
      <a id="mobileAdd" href="dashboard.html?add=1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Əlavə et</span></a>
      <a href="inventory.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v12H4zM8 8V5h8v3M8 13h8"/></svg><span>Stok</span></a>
      <a href="account.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 20c.6-3.4 2.9-5 7-5s6.4 1.6 7 5"/></svg><span>Hesab</span></a>
    </nav>
    <input
      id="excelImport"
      class="visually-hidden"
      type="file"
      accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv"
    />
    <div id="modal" class="overlay hidden">
      <section class="modal">
        <header>
          <h2 id="modalTitle"></h2>
          <button id="closeModal" class="x">×</button>
        </header>
        <div id="modalBody"></div>
      </section>
    </div>
    <div id="undoToast" class="undo-toast hidden"></div>
    <script src="shell.js"></script>
    <script src="orders-bootstrap.js"></script>
    <script src="notifications.js"></script>
      <script src="redesign.js"></script>
    <script src="v29.js"></script>
</body>
</html>
